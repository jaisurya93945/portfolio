<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="J monogram">
  <title>J — Badathala Jaisurya</title>
  <!--
    Geometric J built from one constant-width stroke.

    Three deliberate details, none decorative:
      * the crossbar overhangs left of the stem, so the mark is asymmetric
        and does not read as a typed letter centred in a box;
      * a cut splits the stem — a seam, the security/verification note;
      * the hook ends on a flat vertical terminal rather than tapering,
        which keeps the counter open and legible at 16px.

    No enclosing tile, no gradient. currentColor so it inherits wherever
    it is placed; the standalone file pins the brand coral.
  -->
  <g fill="none" stroke="currentColor" stroke-width="4"
     stroke-linecap="square" stroke-linejoin="miter" color="#ff5f45">
    <path d="M10 6.5H22"/>
    <path d="M22 6.5V12.2"/>
    <path d="M22 16.4V18.6A6.6 6.6 0 0 1 8.8 18.6"/>
  </g>
</svg>
