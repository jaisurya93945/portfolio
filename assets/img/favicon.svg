<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Badathala Jaisurya">
  <!-- The site's one motif: a square cut down the middle, one half solid and
       one half drawn — the same split as the portrait. Geometric, no emblem.
       A tab strip can be light or dark, so the glyph follows the scheme. -->
  <style>
    .ink { fill: #0c0c0e; stroke: #0c0c0e; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f3f2ef; stroke: #f3f2ef; } }
  </style>
  <rect class="ink" x="4.25" y="4.25" width="23.5" height="23.5" rx="1.5" fill="none" stroke-width="2.5"/>
  <path class="ink" d="M5.5 5.5H16v21H5.5z" stroke="none"/>
</svg>
