name: Publish site to main (verified)

# Puts the whole site onto main as a single commit created — and therefore
# signed — by GitHub itself, so main's history carries the Verified badge.
#
# Run from the Actions tab. Safe to re-run: if nothing changed, no commit is
# made. With a RESUME_PAT secret present the commit is authored by you;
# otherwise by the Actions bot. Either way it is verified.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Branch to publish from'
        required: true
        default: 'claude/portfolio-website-interactive-nlmazh'
      message:
        description: 'Commit message'
        required: false
        default: 'Publish portfolio site'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}

      - name: Commit the tree to main through the signing API
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
          HEADLINE: ${{ inputs.message }}
        run: python3 scripts/commit-verified.py --all --branch main

      - name: Report the signature
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/report-signature.py

      # A commit created with GITHUB_TOKEN deliberately does not start
      # workflows, so the deploy has to be asked for. This also fails while
      # main is not the default branch, because the github-pages environment
      # only accepts deployments from it — hence continue-on-error.
      - name: Ask Pages to deploy main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            cat /tmp/r.json
            echo "::notice::Pages did not accept a deploy from main. This is expected until main is the repository's default branch (Settings -> General -> Default branch)."
          fi
