name: Publish verified commit

# Commits pushed over plain git cannot carry a Verified badge: that badge
# asserts a signature from a key belonging to the author, and no automation
# can hold such a key on their behalf.
#
# GitHub's GraphQL createCommitOnBranch is the exception — the server creates
# the commit and signs it as it does so. Measured on this repository:
#
#   committer : GitHub <noreply@github.com>
#   VERIFIED  : true      reason: valid
#
# Authorship follows the token:
#   * secrets.RESUME_PAT  -> authored by you, Verified          <- what you want
#   * GITHUB_TOKEN        -> authored by github-actions[bot], Verified
#
# To author as yourself, create a fine-grained PAT in the browser (no machine
# needed) and save it as the RESUME_PAT secret. See README -> Verified commits.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message'
        required: false
        default: 'chore: republish résumé content'
  push:
    paths:
      - 'resume-source/**'
      # Documentation edits change no résumé content, so they must not
      # produce a commit - that commit triggers a second Pages deploy which
      # races the one already running for this push.
      - '!resume-source/**/*.md'
  # The badge sync is the other thing that produces content nobody typed.
  # Committing it here rather than only shipping it in the Pages artifact
  # means the artwork lives in the repository - the site still has it if a
  # provider is down - and the commit that brings it in is Verified.
  schedule:
    - cron: '12 6 * * *'

permissions:
  contents: write

concurrency:
  group: publish-verified
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild résumé content from the uploaded .docx
        run: python3 scripts/parse-resume-docx.py --out content/resume-data.json

      - name: Pull the badges and platform stats from their issuers
        continue-on-error: true
        env:
          HTB_USER_ID: ${{ vars.HTB_USER_ID }}
        run: python3 scripts/sync-badges.py

      # RESUME_PAT is what makes the commit yours. Without it the mutation
      # still signs, but authors as github-actions[bot] - so say so rather
      # than quietly putting a bot's name on your history.
      - name: Check who the commit will be authored as
        env:
          HAS_PAT: ${{ secrets.RESUME_PAT != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "RESUME_PAT is set — the commit will be authored by you and Verified."
          else
            echo "::warning::RESUME_PAT is not set. This commit will be Verified but"
            echo "::warning::authored by github-actions[bot]. Add a fine-grained PAT with"
            echo "::warning::contents:write as the RESUME_PAT secret to author it yourself."
          fi

      - name: Commit it through the signing API
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
          HEADLINE: "${{ inputs.message || 'chore: refresh credential badges and resume content' }}"
          BODY: |
            Generated by the scheduled sync, not typed: content/resume-data.json
            from the uploaded .docx, and the Credly, TryHackMe and Hack The Box
            badges from each issuer's own public endpoint.
        run: |
          python3 scripts/commit-verified.py \
            content/resume-data.json \
            content/credly.json \
            content/ctf.json \
            $(ls assets/img/badges/*.png assets/img/badges/*.svg \
                 assets/img/badges/*.webp assets/img/badges/*.jpg 2>/dev/null)

      - name: Report the signature
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/report-signature.py

      # A commit made with GITHUB_TOKEN does not start other workflows -
      # GitHub's loop prevention. Without this the daily sync would commit
      # new badges and the site would never pick them up. Asking Pages to
      # deploy explicitly is safe either way: with RESUME_PAT the push also
      # triggers it, and pages.yml cancels the older of two runs.
      - name: Ask Pages to deploy the new commit
        if: env.PUBLISHED_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            && echo "requested a Pages deploy for ${PUBLISHED_SHA}"
