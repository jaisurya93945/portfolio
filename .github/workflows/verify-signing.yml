name: Signing capability probe

# One-off diagnostic. GitHub signs commits it creates itself through the
# GraphQL createCommitOnBranch mutation, but not commits pushed over git or
# written through the REST contents API with an ordinary token. This proves
# which of those is true for this repository before we rely on it.
#
# Run it from the Actions tab: "Signing capability probe" -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a commit through the GraphQL API and read its signature
        env:
          GH_TOKEN: ${{ secrets.RESUME_PAT || secrets.GITHUB_TOKEN }}
          USING_PAT: ${{ secrets.RESUME_PAT != '' }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_OID="$(git rev-parse HEAD)"
          STAMP="signing probe at $(date -u +%FT%TZ)"
          CONTENT="$(printf '%s\n' "$STAMP" | base64 -w0)"

          echo "Using ${USING_PAT:-false} PAT; branch ${BRANCH}; head ${HEAD_OID}"

          cat > q.json <<JSON
          {"query":"mutation(\$i:CreateCommitOnBranchInput!){createCommitOnBranch(input:\$i){commit{oid url}}}",
           "variables":{"i":{
             "branch":{"repositoryNameWithOwner":"${GITHUB_REPOSITORY}","branchName":"${BRANCH}"},
             "message":{"headline":"chore: signing capability probe"},
             "expectedHeadOid":"${HEAD_OID}",
             "fileChanges":{"additions":[{"path":".github/signing-probe.txt","contents":"${CONTENT}"}]}
           }}}
          JSON

          RESP="$(curl -sS -X POST https://api.github.com/graphql \
                    -H "Authorization: bearer ${GH_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data @q.json)"
          echo "$RESP"

          OID="$(printf '%s' "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("data") or {}).get("createCommitOnBranch",{}).get("commit",{}).get("oid",""))')"
          if [ -z "$OID" ]; then
            echo "::error::GraphQL commit failed — see the response above."
            exit 1
          fi

          sleep 3
          VER="$(curl -sS -H "Authorization: bearer ${GH_TOKEN}" \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${OID}")"
          printf '%s' "$VER" | python3 - <<'PY'
          import sys, json
          d = json.load(sys.stdin)
          v = d.get("commit", {}).get("verification", {})
          a = d.get("commit", {}).get("author", {})
          print("=" * 56)
          print("commit   :", d.get("sha", "")[:12])
          print("author   :", a.get("name"), "<%s>" % a.get("email"))
          print("VERIFIED :", v.get("verified"))
          print("reason   :", v.get("reason"))
          print("=" * 56)
          if not v.get("verified"):
              raise SystemExit("commit came back UNVERIFIED (%s)" % v.get("reason"))
          print("Signed commits are available on this repo through GraphQL.")
          PY
